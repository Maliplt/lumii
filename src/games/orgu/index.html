<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f0eb" />
    <meta name="description" content="Örgü — Sayı bulmacası." />
    <title>Örgü</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="language.css" />
    <link rel="stylesheet" href="scene.css" />
    <script defer src="connection-config.js"></script>
    <script defer src="api-adapter.js"></script>
    <script defer src="profile-config.js"></script>
    <script defer src="save-client.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="translations.js"></script>
    <script defer src="language.js"></script>
    <script defer src="audio.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <svg
      class="icon-library"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3Z" />
        <circle cx="12" cy="11" r="3" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h16m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M20 12H4m6-6-6 6 6 6" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" />
      </symbol>
      <symbol id="i-sound" viewBox="0 0 24 24">
        <path d="M4 9h4l5-4v14l-5-4H4Z" />
        <path
          class="sound-waves"
          d="M17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"
        />
        <path class="sound-off" d="m17 9 5 6m0-6-5 6" />
      </symbol>
      <symbol id="i-muted" viewBox="0 0 24 24">
        <path d="M4 9h4l5-4v14l-5-4H4Zm13 0 5 6m0-6-5 6" />
      </symbol>
      <symbol id="i-help" viewBox="0 0 24 24">
        <path d="M8 8a4 4 0 1 1 6 3.5c-2 1-2 1.5-2 3M12 19h.01" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M8 5v14M16 5v14" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="m8 4-5 5 5 5M3 9h10a6 6 0 0 1 0 12" />
      </symbol>
      <symbol id="i-erase" viewBox="0 0 24 24">
        <path d="m4 13 9-10 8 7-9 11H7l-5-5Zm4-4 8 7M12 21h10" />
      </symbol>
      <symbol id="i-hint" viewBox="0 0 24 24">
        <path
          d="M8 16c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7ZM9 20h6M10 23h4"
        />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 24 24">
        <path d="M3 10a9 9 0 1 1 1 8M3 3v7h7" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
      </symbol>
    </svg>
    <div class="app">
      <header class="topbar">
        <button id="home-button" class="brand" data-label="home">
          <span class="brand-mark" aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          >örgü
        </button>
        <div class="top-actions">
          <div class="language-picker">
            <button
              id="language"
              class="icon language-toggle"
              aria-controls="language-panel"
              aria-expanded="false"
            >
              TR
            </button>
            <div id="language-panel" hidden></div>
          </div>
          <button id="theme" class="icon-button" data-label="theme">
            <svg><use href="#i-moon" /></svg></button
          ><button id="help" class="icon-button" data-label="help">
            <svg><use href="#i-help" /></svg></button
          ><button id="sound" class="icon-button" data-label="sound">
            <svg><use href="#i-sound" /></svg>
          </button>
        </div>
      </header>
      <main>
        <section id="home" class="screen home">
          <div class="home-composition">
            <div class="home-art" aria-hidden="true">
              <div id="home-weave" class="board preview-board"></div>
            </div>
            <div class="home-menu">
              <h1>örgü</h1>
              <p class="menu-subtitle" data-t="intro"></p>
              <div class="menu-buttons">
                <button id="play" class="primary play-button">
                  <span data-t="play"></span
                  ><svg aria-hidden="true"><use href="#i-arrow" /></svg>
                </button>
                <div class="menu-secondary">
                  <button id="open-map" class="secondary">
                    <svg aria-hidden="true"><use href="#i-grid" /></svg
                    ><span data-t="levels"></span></button
                  ><button id="learn" class="secondary">
                    <svg aria-hidden="true"><use href="#i-help" /></svg
                    ><span data-t="learn"></span>
                  </button>
                </div>
              </div>
              <div class="menu-progress">
                <span id="home-level"></span
                ><span class="progress-divider" aria-hidden="true"></span
                ><span id="home-progress"></span>
              </div>
            </div>
          </div>
        </section>
        <section id="map" class="screen map-screen" hidden>
          <div class="section-heading">
            <button id="map-back" class="icon-button" data-label="home">
              <svg><use href="#i-back" /></svg>
            </button>
            <h2 data-t="levels"></h2>
            <span id="map-range" class="counter"></span>
          </div>
          <div class="journey-window">
            <div class="journey-line" aria-hidden="true"></div>
            <div id="level-map" class="level-map"></div>
          </div>
          <div class="map-controls">
            <button id="map-prev" class="secondary" data-label="previous">
              <svg><use href="#i-back" /></svg
              ><span data-t="previous"></span></button
            ><button id="map-next" class="secondary" data-label="next">
              <span data-t="next"></span><svg><use href="#i-arrow" /></svg>
            </button>
          </div>
          <button id="map-current" class="map-current">
            <span data-t="continue"></span
            ><svg aria-hidden="true"><use href="#i-arrow" /></svg>
          </button>
        </section>
        <section id="game" class="screen game-screen" hidden>
          <div class="game-top">
            <button id="game-back" class="icon-button" data-label="levels">
              <svg><use href="#i-back" /></svg>
            </button>
            <div class="level-heading">
              <span id="game-mode" class="eyebrow"></span>
              <h2 id="level-title"></h2>
            </div>
            <span id="timer" class="timer">00:00</span
            ><button id="pause" class="icon-button" data-label="pause">
              <svg><use href="#i-pause" /></svg>
            </button>
          </div>
          <div class="play-layout">
            <div id="tutorial-note" class="tutorial-note" hidden>
              <span class="tutorial-number" aria-hidden="true">?</span>
              <div>
                <h3 id="tutorial-title"></h3>
                <p id="tutorial-copy"></p>
              </div>
            </div>
            <div class="board-panel">
              <div class="board-meta">
                <span id="difficulty"></span><span id="equation-count"></span>
              </div>
              <div class="board-progress" aria-hidden="true">
                <i id="board-progress-fill"></i>
              </div>
              <div id="board" class="board" aria-label=""></div>
            </div>
            <aside class="play-side">
              <div class="tray-heading">
                <h3 data-t="yourNumbers"></h3>
                <span id="placed-count" class="counter"></span>
              </div>
              <p id="play-guidance" class="play-guidance"></p>
              <div id="tray" class="tray"></div>
              <div class="tools">
                <button id="undo">
                  <svg aria-hidden="true"><use href="#i-undo" /></svg
                  ><span data-t="undo"></span></button
                ><button id="erase">
                  <svg aria-hidden="true"><use href="#i-erase" /></svg
                  ><span data-t="erase"></span></button
                ><button id="hint">
                  <svg aria-hidden="true"><use href="#i-hint" /></svg
                  ><span data-t="hint"></span></button
                ><button id="restart">
                  <svg aria-hidden="true"><use href="#i-restart" /></svg
                  ><span data-t="restart"></span>
                </button>
              </div>
            </aside>
            <div class="equation-panel">
              <div id="equation-list"></div>
              <p
                id="status"
                class="status"
                role="status"
                aria-live="polite"
              ></p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-inner">
        <span id="modal-mark" class="modal-mark" aria-hidden="true"></span>
        <p id="modal-eyebrow" class="eyebrow"></p>
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </dialog>
  </body>
</html>
