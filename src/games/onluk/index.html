<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="Onluk. Sayıları bağla, 10'u yakala." />
    <title>Onluk</title>
    <link rel="stylesheet" href="styles/language.css" />
    <link rel="stylesheet" href="styles/game.css" />
    <script defer src="connection-config.js"></script>
    <script defer src="src/services/api-adapter.js"></script>
    <script defer src="profile-config.js"></script>
    <script defer src="src/services/save-client.js"></script>
    <script defer src="src/core/journey.js"></script>
    <script defer src="src/core/generator.js"></script>
    <script defer src="src/core/engine.js"></script>
    <script defer src="src/core/selection.js"></script>
    <script defer src="src/services/storage.js"></script>
    <script defer src="src/i18n/translations.js"></script>
    <script defer src="src/i18n/language.js"></script>
    <script defer src="src/audio/audio.js"></script>
    <script defer src="src/ui/effects.js"></script>
    <script defer src="src/ui/journey-view.js"></script>
    <script defer src="src/ui/input.js"></script>
    <script defer src="src/ui/controller.js"></script>
  </head>
  <body>
    <canvas id="atmosphere" aria-hidden="true"></canvas>
    <div class="app" data-screen="home">
      <header>
        <button id="home-button" class="brand" aria-label="Onluk">
          onluk<span>10</span>
        </button>
        <div class="settings">
          <div class="language-picker">
            <button
              id="language"
              class="language-toggle"
              aria-expanded="false"
              aria-controls="language-panel"
            >
              TR
            </button>
            <div id="language-panel" hidden></div>
          </div>
          <button id="theme" class="icon" data-label="theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 15.5A8.8 8.8 0 0 1 8.5 4 8.8 8.8 0 1 0 20 15.5Z" />
            </svg></button
          ><button id="sound" class="icon" data-label="sound">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9h4l5-5v16l-5-5H3Z" />
              <path
                class="sound-wave"
                d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                class="sound-slash"
                d="m16 9 5 6m0-6-5 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg></button
          ><button id="help" class="icon" data-label="help">?</button>
        </div>
      </header>
      <main>
        <section id="home" class="home screen">
          <div class="home-emblem" aria-hidden="true">
            <span class="demo-tile blue">2</span><span class="demo-plus">+</span
            ><span class="demo-tile pink">3</span
            ><span class="demo-plus">+</span
            ><span class="demo-tile yellow">5</span>
          </div>
          <div class="home-left">
            <h1>onluk<span>10</span></h1>
            <p class="tagline" data-t="tagline"></p>
            <div class="home-buttons">
              <button id="play" class="primary">
                <b aria-hidden="true">▶</b><span data-t="play"></span></button
              ><button id="new-game" class="secondary" data-t="newGame"></button
              ><button id="learn" class="text-button" data-t="help"></button>
            </div>
            <button id="journey" class="journey-button"></button>
            <div class="home-record">
              <span data-t="best"></span><strong id="home-best">0</strong>
            </div>
          </div>
        </section>
        <section id="game" class="game screen" hidden>
          <div class="game-heading">
            <span id="mode-label" class="level-title" data-t="round"></span
            ><button id="pause" class="icon pause-button" data-label="pause">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="4" width="5" height="16" rx="2" />
                <rect x="14" y="4" width="5" height="16" rx="2" />
              </svg>
            </button>
          </div>
          <div class="scorebar">
            <div class="score-stat">
              <span data-t="score"></span><strong id="score">0</strong>
              <div id="score-pop" class="score-pop" aria-hidden="true"></div>
            </div>
            <div class="combo">
              <span data-t="multiplier"></span><strong id="combo">1</strong>
            </div>
            <div>
              <span data-t="remaining"></span><strong id="moves">30</strong>
            </div>
          </div>
          <div class="mission">
            <span id="mission-label"></span>
            <div
              id="mission-dots"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div class="progress-fill"></div>
            </div>
            <b id="mission-reward">+3</b>
          </div>
          <div
            id="practice-note"
            class="practice-note"
            hidden
            data-t="practiceCopy"
          ></div>
          <div class="expression-panel" aria-live="off">
            <div class="expression-line">
              <div id="expression"></div>
              <b class="equals">=</b><strong id="sum">10</strong>
            </div>
          </div>
          <p id="rule-note" class="rule-note"></p>
          <div class="board-area">
            <div class="board-shell">
              <div id="board" class="board" role="group"></div>
              <svg
                id="chain-lines"
                class="chain-lines"
                viewBox="0 0 500 600"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <g id="route-connectors"></g>
              </svg>
              <div id="guide-hand" class="guide-hand" aria-hidden="true">
                <svg viewBox="0 0 64 76">
                  <path
                    d="M23 39V12c0-8 12-8 12 0v20c0-7 11-7 11 0v3c0-6 10-6 10 1v17c0 12-8 19-20 19-9 0-14-5-18-12L6 42c-4-7 4-13 9-7l8 9"
                  />
                </svg>
              </div>
            </div>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
          <div class="game-foot">
            <button id="undo" class="text-button" data-t="undo"></button
            ><button id="hint" class="text-button" data-t="hint"></button
            ><span><span data-t="best"></span> <b id="game-best">0</b></span
            ><button id="restart" class="text-button" data-t="restart"></button>
          </div>
        </section>
      </main>
      <footer><span>ONLUK</span></footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-inner">
        <span id="modal-kicker" class="eyebrow"></span>
        <h2 id="modal-title"></h2>
        <div id="modal-copy"></div>
        <div id="modal-actions"></div>
      </div>
    </dialog>
  </body>
</html>
