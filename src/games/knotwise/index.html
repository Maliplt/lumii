<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc2b3" />
    <meta name="description" content="Knotwise: drag the beads until no string crosses another, and a paper picture pops out of the page." />
    <title>Knotwise</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 10L24 22M8 22L24 10' stroke='%232d2a4a' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='10' r='5' fill='%23ff9e8f' stroke='%232d2a4a' stroke-width='2'/%3E%3Ccircle cx='24' cy='22' r='5' fill='%237cc8ff' stroke='%232d2a4a' stroke-width='2'/%3E%3Ccircle cx='8' cy='22' r='5' fill='%23ffd166' stroke='%232d2a4a' stroke-width='2'/%3E%3Ccircle cx='24' cy='10' r='5' fill='%237ee0b8' stroke='%232d2a4a' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/screens.css" />
  </head>
  <body>
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="doodles" aria-hidden="true">
      <svg class="doodle doodle--a" viewBox="0 0 40 40"><path d="M6 24c4-10 12-12 15-6s-4 12-9 7 4-17 16-14 9 16 2 18" /></svg>
      <svg class="doodle doodle--b" viewBox="0 0 40 40"><path d="M20 5l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" /></svg>
      <svg class="doodle doodle--c" viewBox="0 0 40 40"><path d="M4 22q6-10 12 0t12 0 10-2" /></svg>
      <svg class="doodle doodle--d" viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" /><circle cx="20" cy="20" r="4" /></svg>
      <svg class="doodle doodle--e" viewBox="0 0 40 40"><path d="M8 32L32 8M14 8l4 4M26 28l4 4" /></svg>
    </div>
    <main id="app">
      <section id="screen-menu" class="screen menu" hidden></section>
      <section id="screen-pages" class="screen pages-screen" hidden></section>
      <section id="screen-play" class="screen play" hidden></section>
    </main>

    <div class="coach" hidden></div>
    <div id="dialogs"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="veil" aria-hidden="true"></div>

    <noscript><p class="noscript">Knotwise needs JavaScript.</p></noscript>

    <script src="save-config.js"></script>
    <script src="connection-config.js"></script>
    <script src="src/services/api-adapter.js"></script>
    <script src="profile-config.js"></script>
    <script src="src/services/save-client.js"></script>
    <script src="src/core/namespace.js"></script>
    <script src="src/core/random.js"></script>
    <script src="src/puzzle/geometry.js"></script>
    <script src="src/puzzle/motifs.js"></script>
    <script src="src/puzzle/generator.js"></script>
    <script src="src/puzzle/levels.js"></script>
    <script src="src/i18n/translations.js"></script>
    <script src="src/i18n/language.js"></script>
    <script src="src/services/storage.js"></script>
    <script src="src/audio/audio.js"></script>
    <script src="src/render/paper.js"></script>
    <script src="src/ui/dom.js"></script>
    <script src="src/ui/dialogs.js"></script>
    <script src="src/ui/coach.js"></script>
    <script src="src/ui/board.js"></script>
    <script src="src/ui/screens/menu.js"></script>
    <script src="src/ui/screens/pages.js"></script>
    <script src="src/ui/screens/play.js"></script>
    <script src="src/ui/screens/settings.js"></script>
    <script src="src/ui/app.js"></script>
    <script src="src/ui/bootstrap.js"></script>
  </body>
</html>
